# Auto-generated by `compete init`. Edit the windows + agent block to
# match your catalog and team workflow before running `compete run`.
name: competition_2

# Regime-balanced single round (selected via grid search 2026-05-27):
#   train 90d — Oct 6 → Jan 4, B&H=0.7345 (bear regime), well above FinRL 60d floor
#   test  14d — Jan 4 → Jan 18, 70/30 tuning split
#   eval  28d — Jan 18 → Feb 15, B&H=0.7342, strict OOS gate
#   paper 14d — Feb 15 → Mar 1, live testnet trims to duration_minutes
# Δ |eval B&H − train B&H| = 0.0003 (regime check threshold 0.15 satisfied)
windows:
  - train:
      start: "2025-10-06T00:00:00Z"
      end:   "2026-01-04T00:00:00Z"
    test:
      start: "2026-01-04T00:00:00Z"
      end:   "2026-01-18T00:00:00Z"
    eval:
      start: "2026-01-18T00:00:00Z"
      end:   "2026-02-15T00:00:00Z"
    paper:
      start: "2026-02-15T00:00:00Z"
      end:   "2026-03-01T00:00:00Z"

# `live` requires BINANCE_TESTNET_API_KEY/SECRET (auto-loaded from sibling
# ~/Projects/nautilus/nautilus-trading/.envrc via harness _env.py).
paper:
  mode: live
  duration_minutes: 15
  starting_pot_usdt: 1000.0

# The single instrument the competition trades. Both fields must match
# whatever your `data/catalog/` was seeded with.
instrument:
  symbol: "BTCUSDT.BINANCE"
  bar_type: "BTCUSDT.BINANCE-5-MINUTE-LAST-EXTERNAL"

# How `train()` invokes its underlying agent (Claude subprocess).
# Tighten the timeout / iteration count for local dev; loosen for prod.
agent:
  command: ["claude", "--print", "--output-format", "json"]
  per_train_timeout_seconds: 600
  max_train_iterations: 5

# Composite scoring weights. Keys are CANONICAL — typos are rejected at
# YAML-load time (msgspec forbid_unknown_fields). Weights need not sum
# to 1.0; the runner z-scores each metric before combining.
scoring:
  weights:
    sharpe: 0.4
    total_return: 0.4
    max_drawdown: 0.2

# Where the bar-level ParquetDataCatalog lives, relative to <working-dir>.
# Seed it before running `compete run` (see data/catalog/README.md).
catalog:
  path: data/catalog

